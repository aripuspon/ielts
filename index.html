y, dan pemodelan data), kursus Tableau modul 1 (5 dari 21 materi), kursus Excel modul 1–2 (9 dari 37 materi), dan Dasar Visualisasi Data jalur 1–2 (9 dari 22 pelajaran). Kursus Claude AI untuk Pemula (47 materi) gratis seluruhnya, begitu juga Pustaka Chart (11 panduan chart), Lab Latihan (4 latihan interaktif), 8 panduan AI & dashboard dengan prompt siap salin untuk ChatGPT, Claude, dan Gemini, file latihan, serta template Google Sheets. Materi kursus berikutnya (mis. DAX, visual, desain dashboard, dan publish di Power BI) terbuka untuk member. Akun gratis hanya diperlukan kalau kamu ingin progres dan skor kuis tersimpan di semua perangkat."          }        },        {          "@type": "Question",          "name": "Apakah ada akun gratis?",          "acceptedAnswer": {            "@type": "Answer",            "text": "Ada. Dengan akun gratis, progres dan skor kuis Belajar Gratis tersimpan di semua perangkat, kamu bisa menyusun 1 CV di CV Builder ATS (lengkap dengan cek ATS dan unduhan PDF/Word), dan mengunduh template Excel dashboard sampel untuk dipakai sendiri. Template harian dengan hak jual ulang, semua kelas, dan webinar khusus member. Buat akun gratis."          }        },        {          "@type": "Question",          "name": "Apakah membership diperpanjang otomatis?",          "acceptedAnswer": {            "@type": "Answer",            "text": "Tidak. Rp150.000 (di Indonesia) atau US$30 (dari luar Indonesia) adalah pembayaran sekali untuk 12 bulan, tanpa tagihan otomatis. Kalau ingin lanjut, kamu bisa memperpanjang sendiri dari menu Akun di member area. Masa aktif baru ditambahkan setelah tanggal habis yang lama, jadi tidak ada hari yang hangus."          }        },        {          "@type": "Question",          "name": "Bagaimana lisensi produk setelah masa aktif habis?",          "acceptedAnswer": {            "@type": "Answer",            "text": "Produk yang sudah kamu unduh selama masa aktif tetap boleh dipakai dan dijual sesuai lisensinya, termasuk setelah membership berakhir. Yang berhenti hanya akses ke rilis baru, unduhan, kelas, dan webinar."          }        },        {          "@type": "Question",          "name": "Boleh jual template di Shopee, Tokopedia, atau marketplace lain?",          "acceptedAnswer": {            "@type": "Answer",            "text": "Boleh, untuk produk yang lisensinya mengizinkan penjualan ke pelanggan akhir, termasuk template harian (lisensi PLR-END). Kamu boleh mengedit dan memasang brand sendiri, lalu menjualnya di marketplace, toko online, atau langsung ke klien. Tetap ikuti syarat lisensinya, misalnya tidak mengunggah file ke situs download gratis."          }        },        {          "@type": "Question",          "name": "Apakah pembeli boleh menjual ulang template tersebut?",          "acceptedAnswer": {            "@type": "Answer",            "text": "Untuk template harian: tidak. Hak jual ulang tidak diteruskan, jadi pembelimu hanya mendapat hak pakai pribadi. Beberapa produk khusus bisa memakai lisensi lain (misalnya Master Resell Rights yang mengizinkan hak jual ulang diteruskan). Aturannya selalu tertulis di halaman produk dan di sertifikat lisensi. Lihat perbandingan lisensi."          }        },        {          "@type": "Question",          "name": "Metode pembayaran apa saja? Bisa bayar dari luar negeri?",          "acceptedAnswer": {            "@type": "Answer",            "text": "Bisa. Di Indonesia, bayar Rp150.000 dengan QRIS, yang bisa dibayar dari aplikasi e-wallet atau m-banking apa pun yang mendukung QRIS, atau Virtual Account BRI, BNI, Mandiri, BSI, CIMB Niaga, Permata, Maybank, atau Danamon. Kode QR atau nomor VA tampil langsung di halaman kami. Virtual Account dikenai biaya layanan Rp3.000–Rp4.000 yang tampil sebelum kamu membayar. Dari luar Indonesia, bayar US$30 untuk 12 bulan lewat PayPal, pakai saldo PayPal atau kartu debit/kredit. Pembayaran PayPal diselesaikan di halaman PayPal, lalu kamu kembali ke halaman kami. QRIS dan Virtual Account diproses oleh doit.id, PayPal oleh Pakasir. Halaman bayar otomatis memilih opsi yang sesuai lokasimu, dan kamu tetap bisa menggantinya."          }        },        {          "@type": "Question",          "name": "Apakah ada refund?",          "acceptedAnswer": {            "@type": "Answer",            "text": "Tidak ada refund, semua pembayaran bersifat final. Kalau terjadi pembayaran ganda untuk order yang sama, kelebihan pembayaran otomatis dikonversi menjadi perpanjangan masa aktif (setiap pembayaran = 12 bulan), tanpa perlu menghubungi kami. Dana sudah terpotong tapi membership belum aktif? Hubungi kami dengan nomor order kamu, kami cek dan aktifkan. Detailnya di Syarat & Ketentuan."          }        },        {          "@type": "Question",          "name": "Apa itu CV Builder ATS?",          "acceptedAnswer": {            "@type": "Answer",            "text": "Alat menyusun CV di member area dengan template Harvard, ATS Modern, dan Indonesia Profesional: satu kolom, judul bagian standar, tanpa tabel atau gambar, sehingga mudah dibaca sistem rekrutmen (ATS). Ada pengecekan kualitas CV dan kecocokan kata kunci dengan teks lowongan. Unduh sebagai PDF (teks, bukan gambar), Word (.docx), atau teks biasa. CV tersimpan di akunmu dan tetap bisa dibuka serta diunduh setelah masa aktif berakhir."          }        },        {          "@type": "Question",          "name": "Bagaimana cara kerja program afiliasi?",          "acceptedAnswer": {            "@type": "Answer",            "text": "Member aktif bisa bergabung tanpa biaya dari menu Afiliasi di member area, lalu membagikan link referral-nya. Orang yang mendaftar lewat link kamu (atau memakai kupon afiliasi kamu) dan membayar membership akan menghasilkan komisi untukmu.
